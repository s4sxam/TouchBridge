[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchbridge-universal"
version = "1.0.0"
description = "Universal Android Keyboard & Mouse Mapping Bridge for Windows PC"
authors = [{ name = "TouchBridge Open Source Community" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pynput>=1.7.6",
    "requests>=2.31.0"
]

[project.scripts]
touchbridge = "touchbridge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["touchbridge*"]
exclude = ["profiles*", "tests*"]
